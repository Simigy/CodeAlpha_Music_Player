<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A modern music player with playlists, progress bar, volume control, and keyboard navigation — built with vanilla HTML, CSS, and JavaScript." />
  <meta name="author" content="Sherif Ibrahim" />

  <title>Music Player | Sherif Ibrahim</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background glow -->
  <div class="bg-glow"></div>

  <main class="player-wrapper">
    
    <!-- Music Player Card -->
    <div class="player-card">
      
      <!-- Album Art -->
      <div class="album-art-wrapper">
        <img id="albumArt" class="album-art" src="assets/images/cover1.jpg" alt="Album Art" />
        <div class="album-art-overlay"></div>
      </div>

      <!-- Track Info -->
      <div class="track-info">
        <h1 id="trackTitle" class="track-title">American Darlings</h1>
        <p id="trackArtist" class="track-artist">S.A.D. - Acoustic</p>
      </div>

      <!-- Progress Bar -->
      <div class="progress-container" id="progressContainer">
        <span id="currentTime" class="time">0:00</span>
        <div class="progress-bar-wrapper">
          <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
        <span id="totalTime" class="time">0:00</span>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button id="shuffleBtn" class="control-btn" aria-label="Shuffle">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/>
          </svg>
        </button>

        <button id="prevBtn" class="control-btn" aria-label="Previous">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
          </svg>
        </button>

        <button id="playBtn" class="play-btn" aria-label="Play">
          <!-- Play Icon -->
          <svg id="playIcon" viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <!-- Pause Icon (hidden by default) -->
          <svg id="pauseIcon" viewBox="0 0 24 24" width="32" height="32" fill="currentColor" style="display: none;">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>

        <button id="nextBtn" class="control-btn" aria-label="Next">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>

        <button id="repeatBtn" class="control-btn" aria-label="Repeat">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
        </button>
      </div>

      <!-- Volume Control -->
      <div class="volume-container">
        <button id="muteBtn" class="volume-icon" aria-label="Mute">
          <svg id="volOnIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
        </button>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      </div>
    </div>

    <!-- Playlist -->
    <div class="playlist-card">
      <h2 class="playlist-title">Up Next</h2>
      <ul id="playlist" class="playlist">
        <!-- Filled by JS -->
      </ul>
    </div>

  </main>

  <audio id="audio"></audio>

  <script src="script.js"></script>
</body>
</html>
